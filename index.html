<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR Flood Visualization - Meta Quest 3</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            font-family: Arial, sans-serif;
            background: #000;
        }
        
        #container { 
            width: 100vw; 
            height: 100vh; 
        }
        
        #ui {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.95);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            z-index: 1000;
            max-width: 320px;
        }
        
        #ui h3 { 
            margin: 0 0 15px 0; 
            color: #1e40af;
            font-size: 18px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            margin: 8px 0;
            font-size: 13px;
        }
        
        .legend-color {
            width: 30px;
            height: 16px;
            margin-right: 10px;
            border-radius: 4px;
        }

        #vrButton {
            width: 100%;
            padding: 16px;
            margin-top: 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        #vrButton:hover { 
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        #vrButton:disabled { 
            background: #999; 
            cursor: not-allowed; 
            transform: none;
        }

        .vr-info {
            margin-top: 12px;
            padding: 12px;
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            border-radius: 8px;
            font-size: 11px;
            border-left: 4px solid #f59e0b;
        }

        .controls {
            margin-top: 12px;
            padding: 12px;
            background: #f3f4f6;
            border-radius: 8px;
            font-size: 11px;
        }

        .controls strong {
            display: block;
            margin-bottom: 6px;
            color: #374151;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    
    <div id="ui">
        <h3>🌊 VR Flood Visualization</h3>
        <div style="font-size: 12px; color: #666; margin-bottom: 12px;">
            Meta Quest 3 Ready
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background:#bbdefb;"></div>
            &lt; 0.5 m depth
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background:#42a5f5;"></div>
            0.5 – 1 m depth
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background:#1976d2;"></div>
            1 – 2 m depth
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background:#0d47a1;"></div>
            &gt; 2 m depth
        </div>
        <button id="vrButton" disabled>Checking VR Support...</button>
        <div class="controls">
            <strong>🖱️ Desktop Controls:</strong>
            Mouse drag: Rotate | Scroll: Zoom<br>
            Arrow keys: Move camera
        </div>
        <div class="vr-info">
            <strong>🥽 VR Controls:</strong>
            Head movement: Look around<br>
            Thumbsticks: Navigate scene
        </div>
    </div>

    <script>
        const GEOJSON_FILE = 'gridded_30m_T1_flood_only.geojson';
        const CENTER_LNG = 77.027;
        const CENTER_LAT = 28.448;
        
        let scene, camera, renderer, controls;
        let waterMeshes = [];
        let buildings = [];
        let ground;
        
        // Initialize Three.js scene
        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            
            // Camera
            camera = new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                2000
            );
            camera.position.set(0, 50, 100);
            camera.lookAt(0, 0, 0);
            
            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.xr.enabled = true;
            document.getElementById('container').appendChild(renderer.domElement);
            
            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
            sunLight.position.set(100, 200, 100);
            scene.add(sunLight);
            
            // Ground plane
            const groundGeometry = new THREE.PlaneGeometry(2000, 2000);
            const groundMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xd4d4d4,
                roughness: 0.8
            });
            ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.5;
            scene.add(ground);
            
            // Add grid for reference
            const gridHelper = new THREE.GridHelper(2000, 100, 0x888888, 0xcccccc);
            gridHelper.position.y = -0.4;
            scene.add(gridHelper);
            
            // Load data
            loadFloodData();
            createBuildings();
            
            // Check VR support
            checkVRSupport();
            
            // Mouse controls for desktop
            setupMouseControls();
            
            // Keyboard controls
            setupKeyboardControls();
            
            // Start rendering
            renderer.setAnimationLoop(animate);
            
            // Handle resize
            window.addEventListener('resize', onWindowResize);
        }
        
        async function loadFloodData() {
            try {
                const res = await fetch(GEOJSON_FILE);
                if (!res.ok) throw new Error('Flood data file not found');
                const data = await res.json();
                
                let maxDepth = 0;
                
                data.features.forEach(f => {
                    if (!f.geometry || !f.properties) return;
                    const depth = parseFloat(f.properties.value);
                    if (isNaN(depth) || depth <= 0) return;
                    maxDepth = Math.max(maxDepth, depth);
                    
                    if (f.geometry.type === 'Polygon') {
                        const coords = f.geometry.coordinates[0];
                        
                        // Convert lat/lng to local coordinates
                        const points = coords.map(c => {
                            const x = (c[0] - CENTER_LNG) * 111320 * Math.cos(CENTER_LAT * Math.PI / 180);
                            const z = -(c[1] - CENTER_LAT) * 110540;
                            return new THREE.Vector2(x, z);
                        });
                        
                        if (points.length < 3) return;
                        
                        // Create extruded water shape
                        const shape = new THREE.Shape(points);
                        const extrudeSettings = {
                            depth: depth,
                            bevelEnabled: false
                        };
                        
                        const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
                        geometry.rotateX(-Math.PI / 2);
                        
                        // Color based on depth
                        let color;
                        if (depth < 0.5) color = 0xbbdefb;
                        else if (depth < 1.0) color = 0x42a5f5;
                        else if (depth < 2.0) color = 0x1976d2;
                        else color = 0x0d47a1;
                        
                        const material = new THREE.MeshStandardMaterial({
                            color: color,
                            transparent: true,
                            opacity: 0.7,
                            roughness: 0.3,
                            metalness: 0.1
                        });
                        
                        const mesh = new THREE.Mesh(geometry, material);
                        scene.add(mesh);
                        waterMeshes.push(mesh);
                    }
                });
                
                console.log(`Loaded ${waterMeshes.length} water meshes`);
                
            } catch (err) {
                console.error('Error loading flood data:', err);
                alert('Error loading flood data: ' + err.message);
            }
        }
        
        function createBuildings() {
            // Create buildings based on the area
            const buildingData = [
                // Sector 11 area
                { x: 200, z: -150, w: 30, h: 45, d: 25 },
                { x: 240, z: -120, w: 25, h: 38, d: 20 },
                { x: 170, z: -180, w: 35, h: 42, d: 30 },
                
                // Om Nagar area
                { x: -100, z: -80, w: 22, h: 32, d: 18 },
                { x: -130, z: -100, w: 28, h: 35, d: 22 },
                { x: -70, z: -110, w: 20, h: 28, d: 16 },
                { x: -150, z: -70, w: 25, h: 30, d: 20 },
                
                // Raj Nagar area
                { x: -200, z: 50, w: 26, h: 36, d: 22 },
                { x: -180, z: 80, w: 24, h: 33, d: 20 },
                { x: -230, z: 60, w: 22, h: 29, d: 18 },
                
                // Hans Enclave area
                { x: 0, z: 150, w: 20, h: 25, d: 18 },
                { x: 30, z: 140, w: 24, h: 28, d: 20 },
                { x: -30, z: 160, w: 22, h: 26, d: 19 },
                { x: 60, z: 170, w: 18, h: 22, d: 16 },
                
                // Additional buildings
                { x: -50, z: -50, w: 20, h: 30, d: 20 },
                { x: 30, z: -60, w: 25, h: 40, d: 25 },
                { x: -70, z: 40, w: 15, h: 25, d: 15 },
                { x: 50, z: 50, w: 30, h: 35, d: 20 },
                { x: 80, z: -30, w: 22, h: 45, d: 22 },
                { x: -90, z: -20, w: 16, h: 26, d: 16 },
                { x: 120, z: 30, w: 24, h: 38, d: 20 },
            ];
            
            buildingData.forEach(b => {
                const geometry = new THREE.BoxGeometry(b.w, b.h, b.d);
                const material = new THREE.MeshStandardMaterial({ 
                    color: 0xe0e0e0,
                    roughness: 0.7,
                    metalness: 0.2
                });
                const building = new THREE.Mesh(geometry, material);
                building.position.set(b.x, b.h / 2, b.z);
                scene.add(building);
                buildings.push(building);
            });
            
            console.log(`Created ${buildings.length} buildings`);
        }
        
        let mouseDown = false;
        let mouseX = 0, mouseY = 0;
        let cameraRotation = { theta: 0, phi: 45 };
        let cameraDistance = 150;
        
        function setupMouseControls() {
            const container = document.getElementById('container');
            
            container.addEventListener('mousedown', (e) => {
                mouseDown = true;
                mouseX = e.clientX;
                mouseY = e.clientY;
            });
            
            container.addEventListener('mouseup', () => {
                mouseDown = false;
            });
            
            container.addEventListener('mousemove', (e) => {
                if (!mouseDown) return;
                
                const deltaX = e.clientX - mouseX;
                const deltaY = e.clientY - mouseY;
                
                cameraRotation.theta += deltaX * 0.3;
                cameraRotation.phi = Math.max(5, Math.min(85, cameraRotation.phi + deltaY * 0.3));
                
                mouseX = e.clientX;
                mouseY = e.clientY;
                
                updateCameraPosition();
            });
            
            container.addEventListener('wheel', (e) => {
                e.preventDefault();
                cameraDistance = Math.max(50, Math.min(500, cameraDistance + e.deltaY * 0.1));
                updateCameraPosition();
            });
        }
        
        function updateCameraPosition() {
            const theta = cameraRotation.theta * Math.PI / 180;
            const phi = cameraRotation.phi * Math.PI / 180;
            
            camera.position.x = cameraDistance * Math.sin(phi) * Math.sin(theta);
            camera.position.y = cameraDistance * Math.cos(phi);
            camera.position.z = cameraDistance * Math.sin(phi) * Math.cos(theta);
            
            camera.lookAt(0, 0, 0);
        }
        
        const keys = {};
        function setupKeyboardControls() {
            window.addEventListener('keydown', (e) => {
                keys[e.key.toLowerCase()] = true;
            });
            
            window.addEventListener('keyup', (e) => {
                keys[e.key.toLowerCase()] = false;
            });
        }
        
        function handleKeyboardInput() {
            const moveSpeed = 2;
            
            if (keys['arrowup'] || keys['w']) {
                camera.position.z -= moveSpeed;
            }
            if (keys['arrowdown'] || keys['s']) {
                camera.position.z += moveSpeed;
            }
            if (keys['arrowleft'] || keys['a']) {
                camera.position.x -= moveSpeed;
            }
            if (keys['arrowright'] || keys['d']) {
                camera.position.x += moveSpeed;
            }
            if (keys[' ']) {
                camera.position.y += moveSpeed;
            }
            if (keys['shift']) {
                camera.position.y = Math.max(5, camera.position.y - moveSpeed);
            }
        }
        
        async function checkVRSupport() {
            const vrButton = document.getElementById('vrButton');
            
            if (!navigator.xr) {
                vrButton.textContent = '⚠️ WebXR Not Available';
                vrButton.disabled = true;
                return;
            }
            
            try {
                const supported = await navigator.xr.isSessionSupported('immersive-vr');
                
                if (supported) {
                    vrButton.textContent = '🥽 Enter VR Mode';
                    vrButton.disabled = false;
                    vrButton.onclick = enterVR;
                    console.log('✅ VR ready!');
                } else {
                    vrButton.textContent = '⚠️ VR Not Supported';
                    vrButton.disabled = true;
                }
            } catch (err) {
                vrButton.textContent = '⚠️ VR Check Failed';
                vrButton.disabled = true;
                console.error('VR error:', err);
            }
        }
        
        async function enterVR() {
            const vrButton = document.getElementById('vrButton');
            
            try {
                vrButton.textContent = 'Starting VR...';
                
                const session = await navigator.xr.requestSession('immersive-vr', {
                    optionalFeatures: ['local-floor', 'bounded-floor']
                });
                
                await renderer.xr.setSession(session);
                
                vrButton.textContent = '🥽 VR Active';
                document.getElementById('ui').style.display = 'none';
                
                session.addEventListener('end', () => {
                    vrButton.textContent = '🥽 Enter VR Mode';
                    document.getElementById('ui').style.display = 'block';
                    console.log('VR session ended');
                });
                
                console.log('✅ Entered VR mode!');
                
            } catch (err) {
                console.error('VR error:', err);
                alert('Failed to enter VR: ' + err.message);
                vrButton.textContent = '🥽 Enter VR Mode';
            }
        }
        
        function animate() {
            handleKeyboardInput();
            renderer.render(scene, camera);
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // Start the app
        init();
    </script>
</body>
</html>
