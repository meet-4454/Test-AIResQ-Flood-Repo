<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Flood Visualization</title>
    <script src="https://cdn.maptiler.com/maptiler-sdk-js/v2.0.3/maptiler-sdk.umd.js"></script>
    <link href="https://cdn.maptiler.com/maptiler-sdk-js/v2.0.3/maptiler-sdk.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            font-family: Arial, sans-serif;
            background: #000;
        }
        #map { width: 100vw; height: 100vh; }
        
        #ui {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.95);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            z-index: 1000;
            max-width: 280px;
        }
        
        #ui h3 { 
            margin: 0 0 15px 0; 
            color: #1e40af;
            font-size: 18px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            margin: 8px 0;
            font-size: 13px;
        }
        
        .legend-color {
            width: 30px;
            height: 16px;
            margin-right: 10px;
            border-radius: 4px;
        }
        
        #bottomControls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }
        
        #fullscreenButton {
            width: 50px;
            height: 50px;
            background: rgba(255,255,255,0.95);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 24px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #fullscreenButton:hover {
            background: white;
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        
        #vrNote {
            background: rgba(102, 126, 234, 0.95);
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        #loadingMsg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 30px 50px;
            border-radius: 12px;
            font-size: 18px;
            z-index: 10000;
            display: none;
            text-align: center;
        }
        
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto 0;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="loadingMsg">
        <div>Loading Flood Data...</div>
        <div class="loader"></div>
    </div>
    
    <div id="ui">
        <h3>🌊 3D Flood Visualization</h3>
        <div style="font-size: 13px; font-weight: 600; color: #444; margin-bottom: 12px;">
            Depth Range (meters)
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background:#bbdefb;"></div>
            &lt; 0.5 m
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background:#42a5f5;"></div>
            0.5 – 1 m
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background:#1976d2;"></div>
            1 – 2 m
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background:#0d47a1;"></div>
            &gt; 2 m
        </div>
    </div>
    
    <div id="bottomControls">
        <button id="fullscreenButton" title="Toggle Fullscreen">⛶</button>
        <div id="vrNote">Best viewed in VR!</div>
    </div>

    <script>
        let map, scene, camera, renderer, modelTransform;
        let waterMeshes = [];
        let floodData = null;
        
        const API_KEY = '3vyFCdEjKRCq9JRv9kWH';
        const GEOJSON_FILE = 'gridded_30m_T1_flood_only.geojson';
        const CENTER_LNG = 77.027;
        const CENTER_LAT = 28.448;
        
        maptilersdk.config.apiKey = API_KEY;
        
        // Fullscreen toggle
        document.getElementById('fullscreenButton').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        });
        
        // Initialize 2D map first
        map = new maptilersdk.Map({
            container: 'map',
            style: maptilersdk.MapStyle.STREETS,
            center: [CENTER_LNG, CENTER_LAT],
            zoom: 16,
            pitch: 60,
            bearing: -20,
            antialias: true,
            terrain: {
                source: 'terrain',
                exaggeration: 1.5
            }
        });
        
        // Custom 3D layer for the 2D map
        const customLayer = {
            id: '3d-water',
            type: 'custom',
            renderingMode: '3d',
            
            onAdd: function(m, gl) {
                camera = new THREE.Camera();
                scene = new THREE.Scene();
                
                scene.add(new THREE.AmbientLight(0xffffff, 0.7));
                
                const light1 = new THREE.DirectionalLight(0xffffff, 0.8);
                light1.position.set(100, 200, 100);
                scene.add(light1);
                
                const light2 = new THREE.DirectionalLight(0xffffff, 0.4);
                light2.position.set(-100, 100, -100);
                scene.add(light2);
                
                renderer = new THREE.WebGLRenderer({
                    canvas: m.getCanvas(),
                    context: gl,
                    antialias: true
                });
                renderer.autoClear = false;
            },
            
            render: function(gl, matrix) {
                const m = new THREE.Matrix4().fromArray(matrix);
                const l = new THREE.Matrix4()
                    .makeTranslation(
                        modelTransform.translateX,
                        modelTransform.translateY,
                        modelTransform.translateZ
                    )
                    .scale(new THREE.Vector3(
                        modelTransform.scale,
                        -modelTransform.scale,
                        modelTransform.scale
                    ))
                    .multiply(new THREE.Matrix4().makeRotationX(Math.PI / 2));
                
                camera.projectionMatrix = m.multiply(l);
                
                const time = performance.now() * 0.001;
                waterMeshes.forEach(mesh => {
                    if (mesh.material.uniforms) {
                        mesh.material.uniforms.time.value = time;
                    }
                });
                
                renderer.resetState();
                renderer.render(scene, camera);
                map.triggerRepaint();
            }
        };
        
        map.on('style.load', () => {
            // Add terrain source
            map.addSource('terrain', {
                type: 'raster-dem',
                url: `https://api.maptiler.com/tiles/terrain-rgb-v2/tiles.json?key=${API_KEY}`
            });
            
            // Add 3D buildings
            map.addLayer({
                'id': '3d-buildings',
                'source': 'composite',
                'source-layer': 'building',
                'filter': ['==', 'extrude', 'true'],
                'type': 'fill-extrusion',
                'minzoom': 14,
                'paint': {
                    'fill-extrusion-color': '#e0e0e0',
                    'fill-extrusion-height': ['get', 'height'],
                    'fill-extrusion-base': ['get', 'min_height'],
                    'fill-extrusion-opacity': 0.9
                }
            });
            
            const origin = maptilersdk.MercatorCoordinate.fromLngLat([CENTER_LNG, CENTER_LAT], 0);
            modelTransform = {
                translateX: origin.x,
                translateY: origin.y,
                translateZ: origin.z,
                scale: origin.meterInMercatorCoordinateUnits()
            };
            
            map.addLayer(customLayer);
            loadFloodData();
        });
        
        async function loadFloodData() {
            try {
                document.getElementById('loadingMsg').style.display = 'block';
                const res = await fetch(GEOJSON_FILE);
                if (!res.ok) throw new Error('Flood data file not found');
                floodData = await res.json();
                createWater(floodData);
                document.getElementById('loadingMsg').style.display = 'none';
            } catch (err) {
                console.error('Error loading flood data:', err);
                document.getElementById('loadingMsg').style.display = 'none';
                alert('Error loading flood data: ' + err.message);
            }
        }
        
        function createWater(data) {
            let maxDepth = 0;
            
            data.features.forEach(f => {
                if (!f.geometry || !f.properties) return;
                const depth = parseFloat(f.properties.value);
                if (isNaN(depth) || depth <= 0) return;
                maxDepth = Math.max(maxDepth, depth);
                
                if (f.geometry.type === 'Polygon') {
                    const coords = f.geometry.coordinates[0];
                    const points = coords.map(c => {
                        const m = maptilersdk.MercatorCoordinate.fromLngLat([c[0], c[1]]);
                        return new THREE.Vector2(
                            (m.x - modelTransform.translateX) / modelTransform.scale,
                            (m.y - modelTransform.translateY) / modelTransform.scale
                        );
                    });
                    
                    if (points.length < 3) return;
                    
                    const shape = new THREE.Shape(points);
                    const geom = new THREE.ShapeGeometry(shape, 32);
                    geom.rotateX(-Math.PI / 2);
                    
                    const mat = new THREE.ShaderMaterial({
                        uniforms: {
                            time: { value: 0 },
                            depth: { value: depth },
                            maxDepth: { value: maxDepth }
                        },
                        vertexShader: `
                            uniform float time;
                            uniform float depth;
                            varying vec3 vPos;
                            varying float vWave;
                            
                            void main() {
                                vPos = position;
                                vec3 pos = position;
                                
                                float wave = sin(pos.x * 0.01 + time) * 0.5 + 
                                           sin(pos.z * 0.015 - time * 0.8) * 0.4 +
                                           cos(pos.x * 0.008 - pos.z * 0.012 + time * 0.5) * 0.3;
                                vWave = wave;
                                pos.y = depth + wave * 0.8;
                                
                                gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                            }
                        `,
                        fragmentShader: `
                            uniform float depth;
                            uniform float time;
                            varying vec3 vPos;
                            varying float vWave;
                            
                            vec3 getColor(float d) {
                                if (d < 0.5) return vec3(0.73, 0.87, 0.98);
                                if (d < 1.0) return vec3(0.26, 0.65, 0.96);
                                if (d < 2.0) return vec3(0.10, 0.46, 0.82);
                                return vec3(0.05, 0.28, 0.63);
                            }
                            
                            void main() {
                                vec3 col = getColor(depth);
                                
                                // Add caustic effect
                                float caustic = sin(vPos.x * 2.0 + time) * cos(vPos.z * 2.0 - time);
                                col += vec3(pow(abs(caustic), 0.8) * 0.2);
                                
                                // Add foam on edges
                                float foam = smoothstep(0.0, 0.3, vWave) * 0.3;
                                col += vec3(foam);
                                
                                gl_FragColor = vec4(col, 0.8);
                            }
                        `,
                        transparent: true,
                        side: THREE.DoubleSide
                    });
                    
                    const mesh = new THREE.Mesh(geom, mat);
                    scene.add(mesh);
                    waterMeshes.push(mesh);
                }
            });
        }
        
        // Handle window resize
        window.addEventListener('resize', () => {
            map.resize();
        });
    </script>
</body>
</html>
