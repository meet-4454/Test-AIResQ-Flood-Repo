<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR Flood Visualization - Meta Quest 3</title>
    <script src="https://cdn.maptiler.com/maptiler-sdk-js/v2.0.3/maptiler-sdk.umd.js"></script>
    <link href="https://cdn.maptiler.com/maptiler-sdk-js/v2.0.3/maptiler-sdk.css" rel="stylesheet" />
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            font-family: Arial, sans-serif;
        }
        #map { 
            width: 100vw; 
            height: 100vh; 
        }
        
        #ui {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.95);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            z-index: 1000;
            max-width: 320px;
        }
        
        #ui h3 { 
            margin: 0 0 15px 0; 
            color: #1e40af;
            font-size: 18px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            margin: 8px 0;
            font-size: 13px;
        }
        
        .legend-color {
            width: 30px;
            height: 16px;
            margin-right: 10px;
            border-radius: 4px;
        }

        .vr-info {
            margin-top: 12px;
            padding: 12px;
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            border-radius: 8px;
            font-size: 11px;
            border-left: 4px solid #f59e0b;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <div id="ui">
        <h3>🌊 VR Flood Visualization</h3>
        <div style="font-size: 12px; color: #666; margin-bottom: 12px;">
            Meta Quest 3 Ready
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background:#bbdefb;"></div>
            &lt; 0.5 m depth
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background:#42a5f5;"></div>
            0.5 – 1 m depth
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background:#1976d2;"></div>
            1 – 2 m depth
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background:#0d47a1;"></div>
            &gt; 2 m depth
        </div>
        <div class="vr-info">
            <strong>🥽 Enter VR Mode:</strong>
            Click the AR/VR button (bottom-right) on Meta Quest 3 browser
        </div>
    </div>

    <script>
        const API_KEY = '3vyFCdEjKRCq9JRv9kWH';
        const GEOJSON_FILE = 'gridded_30m_T1_flood_only.geojson';
        const CENTER_LNG = 77.027;
        const CENTER_LAT = 28.448;
        
        let map;
        
        maptilersdk.config.apiKey = API_KEY;
        
        // Initialize map with the exact style you want
        map = new maptilersdk.Map({
            container: 'map',
            style: maptilersdk.MapStyle.STREETS, // Clean streets basemap
            center: [CENTER_LNG, CENTER_LAT],
            zoom: 16,
            pitch: 60,
            bearing: -20,
            antialias: true,
            hash: false
        });
        
        map.on('load', () => {
            // Add terrain for natural elevation
            map.addSource('terrain', {
                type: 'raster-dem',
                url: `https://api.maptiler.com/tiles/terrain-rgb-v2/tiles.json?key=${API_KEY}`,
                tileSize: 256
            });
            
            map.setTerrain({
                source: 'terrain',
                exaggeration: 1.5
            });
            
            // Add 3D buildings - extruded
            map.addLayer({
                'id': '3d-buildings',
                'source': 'composite',
                'source-layer': 'building',
                'filter': ['==', 'extrude', 'true'],
                'type': 'fill-extrusion',
                'minzoom': 14,
                'paint': {
                    'fill-extrusion-color': '#e0e0e0',
                    'fill-extrusion-height': ['get', 'height'],
                    'fill-extrusion-base': ['get', 'min_height'],
                    'fill-extrusion-opacity': 0.9
                }
            });
            
            // Load and add flood water as extruded layer
            loadFloodData();
            
            // Add AR/VR control
            addARControl();
        });
        
        async function loadFloodData() {
            try {
                const res = await fetch(GEOJSON_FILE);
                if (!res.ok) throw new Error('Flood data file not found');
                const data = await res.json();
                
                // Add flood data as a GeoJSON source
                map.addSource('flood-data', {
                    type: 'geojson',
                    data: data
                });
                
                // Add extruded water layer (just like buildings)
                map.addLayer({
                    'id': 'flood-water-3d',
                    'type': 'fill-extrusion',
                    'source': 'flood-data',
                    'paint': {
                        // Color based on water depth (value property)
                        'fill-extrusion-color': [
                            'interpolate',
                            ['linear'],
                            ['get', 'value'],
                            0, '#bbdefb',      // < 0.5m - light blue
                            0.5, '#42a5f5',    // 0.5-1m - medium blue
                            1.0, '#1976d2',    // 1-2m - dark blue
                            2.0, '#0d47a1'     // > 2m - very dark blue
                        ],
                        // Height based on water depth
                        'fill-extrusion-height': [
                            '*',
                            ['get', 'value'],
                            1  // Scale factor: 1 meter of water = 1 meter height
                        ],
                        'fill-extrusion-base': 0,
                        'fill-extrusion-opacity': 0.7
                    }
                });
                
                console.log('Flood water layer added successfully');
                
            } catch (err) {
                console.error('Error loading flood data:', err);
                alert('Error loading flood data: ' + err.message);
            }
        }
        
        function addARControl() {
            // Add MapTiler's native AR/VR control for WebXR
            const arControl = new maptilersdk.ARControl();
            map.addControl(arControl, 'bottom-right');
            
            // Check WebXR support
            if (navigator.xr) {
                navigator.xr.isSessionSupported('immersive-vr').then(supported => {
                    if (supported) {
                        console.log('✅ Meta Quest 3 VR ready! Click AR button to enter VR.');
                    } else {
                        console.log('⚠️ VR not supported on this device');
                    }
                });
            } else {
                console.log('⚠️ WebXR not available');
            }
        }
        
        // Keyboard controls for desktop navigation
        window.addEventListener('keydown', (e) => {
            switch(e.key.toLowerCase()) {
                case 'w': map.panBy([0, -50]); break;
                case 's': map.panBy([0, 50]); break;
                case 'a': map.panBy([-50, 0]); break;
                case 'd': map.panBy([50, 0]); break;
                case 'q': map.setBearing(map.getBearing() - 10); break;
                case 'e': map.setBearing(map.getBearing() + 10); break;
                case '+': 
                case '=': map.zoomIn(); break;
                case '-': map.zoomOut(); break;
                case 'arrowup': map.setPitch(Math.min(85, map.getPitch() + 5)); break;
                case 'arrowdown': map.setPitch(Math.max(0, map.getPitch() - 5)); break;
            }
        });
        
        // Handle resize
        window.addEventListener('resize', () => {
            map.resize();
        });
    </script>
</body>
</html>
